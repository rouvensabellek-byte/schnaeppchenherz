name: Deals abholen

on:
  schedule:
    - cron: '17 */3 * * *' # alle 3 Stunden
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scraper/scrape.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SKIP_EIS: '1'
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
      - name: Daten committen
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daten $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs || true
          git push
